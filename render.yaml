# Render Blueprint — 台股智慧篩選雷達
# 使用方式：Render Dashboard → New → Blueprint → 選擇此 repo
services:
  - type: web
    name: stock-radar
    runtime: python
    plan: free
    region: singapore          # 離台灣最近，抓 TWSE / Yahoo 行情延遲最低
    buildCommand: pip install -r requirements.txt
    # 單一 worker + 多執行緒：data_source.py 的 TTL 快取是行程內記憶體，
    # 多 worker 會讓快取與 watchlist.json 不同步，且免費方案僅 512MB RAM。
    # timeout 拉到 120s 是因為 analyze_many() 一次並行抓 20 支股票行情。
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: STOCK_RADAR_NO_BROWSER
        value: "1"
